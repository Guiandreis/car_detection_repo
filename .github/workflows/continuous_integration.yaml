name: Continuous Integration

description: This project is a continuous integration pipeline for an object detection system. It is a simple pipeline that uses GitHub Actions test the code.

on:
  pull_request:
    branches:
      - main
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Run CI checks (via Makefile)
        run: make ci

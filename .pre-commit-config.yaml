default_install_hook_types: [pre-commit, pre-push]

repos:
  # Basic quality checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
      - id: check-added-large-files
        args: [--maxkb=10000]  # Prevent files >10MB
      - id: check-merge-conflict

  - repo: local
    hooks:
      - id: format
        name: Format code with Ruff (via Make)
        entry: make format
        language: system
        stages: [pre-commit]
        pass_filenames: false
        verbose: true

      - id: lint
        name: Lint code with Ruff (via Make)
        entry: make lint
        language: system
        stages: [pre-commit]
        pass_filenames: false
        verbose: true

      - id: tests
        name: Run unit tests (via Make)
        entry: make test
        language: system
        stages: [pre-push]
        pass_filenames: false
        verbose: true
        require_serial: true
